<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відеоархів | Rjaviy Lab</title>
    <!-- Підключаємо наш єдиний та зафіксований style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ТАКТИЧНИЙ ШІ-ФОН (Синхронізовано з усім сайтом) -->
    <div class="site-bg-image-container">
        <div class="site-bg-overlay"></div>
    </div>

    <!-- Шапка сайту з клікабельним логотипом зліва та назвою розділу справа -->
    <header>
        <!-- ЛІВА ЧАСТИНА: Клікабельний логотип (повернення на головну) -->
        <a href="index.html" class="tech-card-link" style="display: block;">
            <div class="brand-container">
                <div class="logo-container">
                    <img src="images/logo.png" alt="Логотип Ржавий БПЛА" class="site-logo">
                    <h1>Rjaviy</h1>
                </div>
            </div>
        </a>
        
        <!-- ПРАВА ЧАСТИНА: Назва поточної сторінки -->
        <div class="page-title-right">
            <h2>Videos</h2>
        </div>
    </header>

    <!-- Головний контейнер для відеогалереї -->
    <div class="main-container-layout">
        
        <div class="tech-card-wrapper full-width-card">
            <section class="tech-card">
                <div class="card-status">ARCHIVE: Video</div>
                <h2>Файно проводимо час</h2>
                
                <!-- 🌟 Сітка для вертикальних відео -->
                <div class="video-grid-layout" id="dynamic-video-grid"></div>
            </section>
        </div>

    </div>

    <!-- 🌟 НАДІЙНИЙ АВТОМАТИЧНИЙ СКРИПТ (БЕЗ МАСИВІВ ТА КОМ) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const grid = document.getElementById("dynamic-video-grid");
            
            /* 🔍 ЗАРАЗ У ТЕБЕ 3 ВІДЕО. ЯКЩО ДОДАСЬ ЧЕТВЕРТЕ АБО П'ЯТЕ — 
               ПРОСТО ЗМІНИ ЦЮ ЦИФРУ НА 4, 5, 10... І БІЛЬШЕ НІЧОГО НЕ ЧІПАЙ! */
            const totalVideos = 4; 
            
            let gridElements = "";

            // Цикл сам безпомилково генерує плеєри для video1.mp4, video2.mp4, video3.mp4...
            for (let i = 1; i <= totalVideos; i++) {
                gridElements += `
                    <div class="instagram-video-item">
                        <div class="video-status-bar">CAM: 0${i}</div>
                        <video controls loop playsinline>
                            <source src="video/video${i}.mp4" type="video/mp4">
                            Ваш браузер не підтримує програвання відео.
                        </video>
                    </div>
                `;
            }

            grid.innerHTML = gridElements;
        });
    </script>

</body>
</html>
